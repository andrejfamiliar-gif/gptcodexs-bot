name: Export shop database
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent database
        uses: actions/cache/restore@v4
        with:
          path: shop-state.enc
          key: telegram-shop-state-
          restore-keys: telegram-shop-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Decrypt database
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python state_archive.py unpack shop-state.enc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-sqlite3
          path: shop.sqlite3