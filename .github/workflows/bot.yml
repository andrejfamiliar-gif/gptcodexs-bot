name: Telegram account shop bot

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted jobs are limited to six hours. The bot exits before that
    # limit; the next scheduled run starts a fresh polling process.
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CRYPTO_PAY_TOKEN: ${{ secrets.CRYPTO_PAY_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      TELEGRAM_PROXY: ""
      DB_PATH: shop.sqlite3
      PAYMENT_POLL_SECONDS: "15"
      CRYPTO_PAY_BASE_URL: https://pay.crypt.bot
      CRYPTO_ACCEPTED_ASSETS: USDT,TON,BTC,ETH,LTC,BNB,TRX,USDC
      SUPPORT_USERNAME: "@codexrepIybot"
      SUPPORT_LABEL: "@admingpt"
      SUPPORT_LINK: https://t.me/codexrepIybot
      GPT_PLUS_NW_PRICE_USD: "2"
      GPT_PLUS_FW_PRICE_USD: "4.5"
      PRO_5X_NW_PRICE_USD: "45"
      PRO_20X_NW_PRICE_USD: "135"
      GPT_PLUS_NW_PRICE_RUB: "200"
      GPT_PLUS_FW_PRICE_RUB: "450"
      PRO_5X_NW_PRICE_RUB: "2950"
      PRO_20X_NW_PRICE_RUB: "5900"
      DISPLAY_STOCK_GPT_PLUS_NW: "4"
      DISPLAY_STOCK_GPT_PLUS_FW: "4"
      DISPLAY_STOCK_PRO_5X_NW: "6"
      DISPLAY_STOCK_PRO_20X_NW: "1"
      DECREMENT_STOCK_ON_PAYMENT: "false"
      CNY_PER_USD: "7.20"
      RUB_PER_USD: "80.00"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run bot
        # Leave time for the runner to finish cleanly before the six-hour cap.
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 350m python bot.py
          status=$?
          # A planned window end is normal; other exit codes are real failures.
          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
            exit 0
          fi
          exit "$status"
