name: Telegram account shop bot

on:
  workflow_dispatch:
  schedule:
    # Start a fresh polling process every five hours, before the six-hour cap.
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-account-shop-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    # Leave a short buffer for encryption and cache save before the next
    # five-hour scheduled run starts.
    timeout-minutes: 305
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CRYPTO_PAY_TOKEN: ${{ secrets.CRYPTO_PAY_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      TELEGRAM_PROXY: ""
      DB_PATH: shop.sqlite3
      PAYMENT_POLL_SECONDS: "15"
      CRYPTO_PAY_BASE_URL: https://pay.crypt.bot
      CRYPTO_ACCEPTED_ASSETS: USDT,TON,BTC,ETH,LTC,BNB,TRX,USDC
      SUPPORT_USERNAME: "@codexrepIybot"
      SUPPORT_LABEL: "@admingpt"
      SUPPORT_LINK: https://t.me/codexrepIybot
      OFFER_LINK: https://telegra.ph/GPT-Codex-Shop-Terms-of-Sale-and-Public-Offer-08-05
      PRIVACY_LINK: https://telegra.ph/GPT-Codex-Shop-Privacy-Policy-08-05
      GPT_PLUS_NW_PRICE_USD: "1.63"
      GPT_PLUS_FW_PRICE_USD: "3.75"
      PRO_5X_NW_PRICE_USD: "20.63"
      PRO_20X_NW_PRICE_USD: "41.88"
      GPT_PLUS_NW_PRICE_RUB: "130"
      GPT_PLUS_FW_PRICE_RUB: "300"
      PRO_5X_NW_PRICE_RUB: "1650"
      PRO_20X_NW_PRICE_RUB: "3350"
      DISPLAY_STOCK_GPT_PLUS_NW: "4"
      DISPLAY_STOCK_GPT_PLUS_FW: "4"
      DISPLAY_STOCK_PRO_5X_NW: "6"
      DISPLAY_STOCK_PRO_20X_NW: "1"
      DECREMENT_STOCK_ON_PAYMENT: "false"
      CNY_PER_USD: "7.20"
      RUB_PER_USD: "80.00"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore persistent database and logs
        uses: actions/cache/restore@v4
        with:
          path: shop-state.enc
          key: telegram-shop-state-${{ github.run_id }}
          restore-keys: |
            telegram-shop-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Decrypt persistent database and logs
        run: python state_archive.py unpack shop-state.enc

      - name: Run bot
        # Stop before the next five-hour schedule so state can be saved cleanly.
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 295m python bot.py
          status=$?
          # A planned window end is normal; other exit codes are real failures.
          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
            exit 0
          fi
          exit "$status"

      - name: Save persistent database and logs
        if: always()
        run: python state_archive.py pack shop-state.enc

      - name: Cache encrypted database and logs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: shop-state.enc
          key: telegram-shop-state-${{ github.run_id }}
